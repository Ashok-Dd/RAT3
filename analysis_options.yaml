# Static analysis configuration. See https://dart.dev/tools/analysis
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    use_build_context_synchronously: warning
    unawaited_futures: warning

linter:
  rules:
    - avoid_print
    - unawaited_futures
    - use_build_context_synchronously
    - directives_ordering
    - prefer_final_locals
