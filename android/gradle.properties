org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=false

kotlin.code.style=official
# The incremental Kotlin compiler's storage has crashed the daemon on this
# project; full compilation is reliable and the module is small.
kotlin.incremental=false
