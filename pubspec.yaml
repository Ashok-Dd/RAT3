name: rat3
description: "RAT3 — pre-installation APK security scanner (Android only)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Scanner data (signatures / blocklist / trusted certs) lives in
  # android/app/src/main/assets/ — it is read by the Kotlin layer, not by Dart.
