name: rat3
description: "RAT3 — pre-installation APK scanner + post-installation device monitor (Android only)."
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.10.8
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.3.2

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Runtime permissions
  permission_handler: ^11.3.1

  # Date / number formatting
  intl: ^0.19.0

  # Real app version/build number for the Settings "About" section
  package_info_plus: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Scanner data (signatures / blocklist / trusted certs / ML models) lives in
  # android/app/src/main/assets/ — it is read by the Kotlin layer, not by Dart.

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Medium.ttf
          weight: 500
